services:
  - type: web
    name: edsia-beyond-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: edsia-beyond-db
          property: connectionString
      - key: ENVIRONMENT
        value: production

databases:
  - name: edsia-beyond-db
    databaseName: edsia_db
    user: edsia_user
    plan: starter
