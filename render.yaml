services:
  - type: web
    name: solaris-monitoring-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: solaris-monitoring-db
          property: connectionString
      - key: ENVIRONMENT
        value: production

databases:
  - name: solaris-monitoring-db
    databaseName: solaris_monitoring_db
    user: solaris_user
    plan: free 
