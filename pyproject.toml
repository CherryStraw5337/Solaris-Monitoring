[project]
name = "edsia-beyond"
version = "0.1.0"
description = "EDSIA Beyond project"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
exclude = [".venv", ".git", "__pycache__", "dist", "build", "alembic"]

[tool.ruff.lint.isort]
known-first-party = ["edsia_beyond"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_also = [
    "^\\s*\\.\\.\\.$",
    "if TYPE_CHECKING:",
]
