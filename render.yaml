services:
  - type: web
    name: solaris-monitoring-api
    runtime: docker
    plan: starter
    branch: main
    # "commit" y no "checksPass": los commits de versión que empuja semantic-release
    # usan GITHUB_TOKEN, que no dispara el CI, así que nunca tendrían checks y el
    # servicio dejaría de desplegar. La calidad ya se valida en el CI del pull request.
    autoDeployTrigger: commit
    healthCheckPath: /health
    # Corre en una instancia aparte antes de cambiar el tráfico: si la migración falla,
    # el deploy se cancela y sigue en línea la versión anterior.
    preDeployCommand: alembic upgrade head
    # Sustituye el CMD del Dockerfile, que también migra para docker-compose local.
    dockerCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: solaris-monitoring-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      # sync: false no crea el valor en un Blueprint ya existente: Render lo ignora al
      # sincronizar. La clave se agrega a mano en Environment del servicio.
      - key: DEVICE_API_KEY
        sync: false
      # MQTT es opcional: sin MQTT_HOST la API arranca y solo recibe lecturas por HTTP.
      # Igual que DEVICE_API_KEY, los valores se cargan a mano en Environment.
      - key: MQTT_HOST
        sync: false
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: MQTT_TOPIC
        value: solaris/edsia_beyond/cell_1/voltage

databases:
  - name: solaris-monitoring-db
    databaseName: solaris_monitoring_db
    user: solaris_user
    plan: free
