version: '3.8'

services:
  api:
    build: .
    container_name: edsia-beyond-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://edsia_user:edsia_pass@db:5432/edsia_db
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - edsia-network

  db:
    image: postgres:16-alpine
    container_name: edsia-beyond-db
    environment:
      POSTGRES_USER: edsia_user
      POSTGRES_PASSWORD: edsia_pass
      POSTGRES_DB: edsia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edsia_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edsia-network

volumes:
  postgres_data:

networks:
  edsia-network:
    driver: bridge
