services:
  db:
    image: postgres:15-alpine
    container_name: solaris-monitoring-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solaris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solaris_local}
      POSTGRES_DB: ${POSTGRES_DB:-solaris_monitoring}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # La API migra al arrancar: sin esta comprobación, alembic corre antes de que
    # Postgres acepte conexiones y el contenedor muere en el primer intento.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solaris} -d ${POSTGRES_DB:-solaris_monitoring}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: solaris-monitoring-api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Los valores por defecto hacen que `docker compose up --build` funcione sin
    # crear ningún archivo. Para usar credenciales propias, copia .env.example a .env.
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://solaris:solaris_local@db:5432/solaris_monitoring}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEVICE_API_KEY: ${DEVICE_API_KEY:-clave_local_solo_para_desarrollo}
      # MQTT queda apagado salvo que definas MQTT_HOST en tu .env.
      MQTT_HOST: ${MQTT_HOST:-}
      MQTT_PORT: ${MQTT_PORT:-8883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TOPIC: ${MQTT_TOPIC:-solaris/readings}
    volumes:
      - ./src:/app/src

volumes:
  postgres_data:
