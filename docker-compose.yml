version: '3.8'

services:
  api:
    build: .
    container_name: solaris-monitoring-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://solaris_user:solaris_pass@db:5432/solaris_monitoring_db
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - solaris-network

  db:
    image: postgres:16-alpine
    container_name: solaris-monitoring-db
    environment:
      POSTGRES_USER: solaris_user
      POSTGRES_PASSWORD: solaris_pass
      POSTGRES_DB: solaris_monitoring_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solaris_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solaris-network

volumes:
  postgres_data:

networks:
  solaris-network:
    driver: bridge
